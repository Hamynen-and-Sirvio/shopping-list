services:
  database:
    image: postgres:17-alpine
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: pg_isready -d postgres
      start_period: 30s
      start_interval: 1s

  limiter-data-store:
    image: mongo:8
    volumes:
      - mongo_db:/data/db
      - mongo_configdb:/data/configdb
    healthcheck:
      test: mongosh --eval 'db.runCommand("ping")'
      start_period: 30s
      start_interval: 1s

  backend:
    image: shopping-list-backend
    build:
      context: backend
      dockerfile: dev.Dockerfile
    command: /bin/sh -c 'npx prisma db push && npx node src/index.ts'
    volumes:
      - ./backend:/app
      - node_modules_backend:/app/node_modules
      - prisma_generated:/app/generated
    environment:
      DATABASE_URL: postgres://postgres:postgres@database
      LIMITER_DB_URL: mongodb://limiter-data-store
      LIMITER_DB_NAME: limiter-db
      PORT: 3000
      HOST: 0.0.0.0
      PASSWORD_HASH: 2b84ed4184c0fd093b62ef952b4e9025:3481b4599bdf5135a574714bd09bcc11765d6b65896939159ca0e42e615cf8cb5c6cad7f40ed274fa6a6efa0bd8eb1aa404316e623808aebb0af17910b80414b
      SECRET: secret
    pull_policy: never
    depends_on:
      database:
        condition: service_healthy
      limiter-data-store:
        condition: service_healthy

  frontend:
    image: shopping-list-frontend
    build:
      context: frontend
      dockerfile: dev.Dockerfile
    command: npx vite --host 0.0.0.0
    ports:
      - 127.0.0.1:5173:5173
    volumes:
      - ./frontend:/app
      - node_modules_frontend:/app/node_modules
    pull_policy: never

volumes:
  node_modules_backend:
  prisma_generated:
  node_modules_frontend:
  database:
  mongo_db:
  mongo_configdb:
