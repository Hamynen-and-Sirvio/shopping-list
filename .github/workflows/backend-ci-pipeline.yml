name: Backend CI pipeline

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/**']

jobs:
  preparation_pipeline:
    runs-on: ubuntu-latest

    services:
      test-database:
        image: postgres:17-alpine
        env:
          PGUSER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -d postgres"
          --health-start-period 30s
          --health-start-interval 1s

      test-limiter-data-store:
        image: mongo:8
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-start-period 30s
          --health-start-interval 1s

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-${{ hashFiles('./backend/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm clean-install
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Tsc
        run: npm run tsc
        working-directory: backend

      - name: ESLint
        run: npm run lint
        working-directory: backend

      - name: Initialize test database
        run: npx prisma db push
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost

      - name: Integration tests
        run: |
          node src/index.ts &> backend.log & BACKEND_PID=$!
          npm test && TESTS_RESULT=success || TESTS_RESULT=failure
          kill $BACKEND_PID && wait $BACKEND_PID
          echo "### Backend output below ###" && cat backend.log
          [[ $TESTS_RESULT == success ]]
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost
          LIMITER_DB_URL: mongodb://localhost
          LIMITER_DB_NAME: test-limiter-db
          PORT: 3000
          HOST: 127.0.0.1
          PASSWORD_HASH: 2b84ed4184c0fd093b62ef952b4e9025:3481b4599bdf5135a574714bd09bcc11765d6b65896939159ca0e42e615cf8cb5c6cad7f40ed274fa6a6efa0bd8eb1aa404316e623808aebb0af17910b80414b
          SECRET: secret
          RATE_LIMITER: off

      - name: Apply all pending migrations to the database
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deployment_pipeline:
    needs: preparation_pipeline
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate to Docker
        uses: docker/login-action@v3
        with:
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build, tag and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: '{{defaultContext}}:backend'
          push: true
          tags: >
            ${{ secrets.BACKEND_IMAGE_URL }}:${{ github.sha }},
            ${{ secrets.BACKEND_IMAGE_URL }}:latest
          cache-from: type=registry,ref=${{ secrets.BACKEND_IMAGE_URL }}:latest
          cache-to: type=inline

      - name: Deploy to Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ secrets.BACKEND_IMAGE_URL }}:latest
