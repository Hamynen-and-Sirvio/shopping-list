services:
  test-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres"]
      start_period: 30s
      start_interval: 1s

  test-backend:
    image: typic-lists-backend
    build: backend
    command: /bin/sh -c 'npx prisma db push && npx node index.ts'
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./backend:/app
      - node_modules_test_backend:/app/node_modules
    environment:
      DATABASE_URL: postgres://postgres:postgres@test-database
      PORT: 3000
      HOST: 0.0.0.0
      PASSWORD_HASH: aecd9cd7f5ca210c4dd6a265c4844b4d:a29854c8bdc20fd9bca1884fb6f8c4b5f3dde7fd81884afdc383946f873e28a32b77fff6af3bcba72e69c6a33d5936ecdb78f47a53cc66b83c1439ba96bfe887
      SECRET: secret
    pull_policy: never
    depends_on:
      test-database:
        condition: service_healthy

volumes:
  node_modules_test_backend:
